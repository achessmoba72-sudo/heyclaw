[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "heyclaw-shared"
version = "0.1.0"
description = "Settings, logging, and provider configuration shared by the HeyClaw components"
requires-python = ">=3.12,<3.13"
dependencies = [
    "loguru>=0.7.3",
    "orjson>=3.11.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["heyclaw_shared"]

[tool.ruff]
target-version = "py312"
exclude = ["**/__pycache__/**", "**/.venv/**"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM", "RUF"]
ignore = ["E501", "E402", "E712", "B008", "B905", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
follow_imports = "normal"
disable_error_code = ["attr-defined", "arg-type", "assignment", "union-attr", "misc"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
