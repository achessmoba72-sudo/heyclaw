[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "heyclaw-satellite"
version = "0.1.0"
description = "Local audio and wake-word satellite for HeyClaw"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aec-audio-processing>=1.0.1,<2.0.0",
    "ai-edge-litert>=2.1.6",
    "elevenlabs>=2.15.0",
    "heyclaw-shared",
    "loguru>=0.7.3",
    "numpy>=2.0.0",
    "openwakeword @ git+https://github.com/dscripka/openWakeWord.git@368c03716d1e92591906a84949bc477f3a834455",
    "orjson>=3.11.0",
    "pyaudio>=0.2.14",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
]

[project.scripts]
heyclaw-satellite = "app.cli:run"
heyclaw-audio-devices = "app.cli:list_audio_devices"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
    "types-pyaudio>=0.2.16",
]

[tool.uv.sources]
heyclaw-shared = { path = "../shared", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--tb=short", "--cov=app", "--cov-report=term-missing"]

[tool.ruff]
target-version = "py312"
exclude = ["**/__pycache__/**", "**/.venv/**", "**/tests/**"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM", "RUF"]
ignore = ["E501", "E402", "E712", "B008", "B905", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
follow_imports = "normal"
exclude = ["tests/"]
disable_error_code = ["attr-defined", "arg-type", "assignment", "union-attr", "misc"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
