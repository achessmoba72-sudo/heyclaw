[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "heyclaw"
version = "0.2.0"
description = "Real-time Python backend for a voice assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dspy>=3.0.4,<4.0.0",
    "elevenlabs>=2.15.0",
    "fastapi>=0.116.0",
    "google-genai>=1.30.0",
    "heyclaw-shared",
    "httpx>=0.28.0",
    "loguru>=0.7.3",
    "mcp>=2,<3",
    "mem0ai>=2.0.17",
    "orjson>=3.11.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "rapidfuzz>=3.0.0",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
heyclaw-api = "app.cli:run_api"
heyclaw-speech-engine = "app.cli:run_speech_engine"
heyclaw-serve = "app.cli:run_all"
heyclaw-create-engine = "app.cli:create_engine"
heyclaw-benchmark = "app.cli:benchmark_llm"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
]

[tool.uv.sources]
heyclaw-shared = { path = "../shared", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--tb=short", "--cov=app", "--cov-report=term-missing"]
markers = ["integration: requires real cloud services"]

# ── Ruff ────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
exclude = ["**/__pycache__/**", "**/.venv/**", "**/tests/**"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM", "RUF"]
ignore = ["E501", "E402", "E712", "B008", "B905", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


# ── Mypy ────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
follow_imports = "normal"
exclude = ["tests/"]
disable_error_code = ["attr-defined", "arg-type", "assignment", "union-attr", "misc"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
